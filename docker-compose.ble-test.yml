# Compose "usa e getta" per testare UN SOLO file del body (test_ble_square.py)
# via Bluetooth reale, senza avviare redis/brain/vision.
#
# Uso:
#   docker compose -f docker-compose.ble-test.yml up --build
#   docker compose -f docker-compose.ble-test.yml down
#
# Per lanciare un altro file di prova basta cambiare "command" sotto
# (oppure passarlo a runtime, vedi nota in fondo).
services:
  body-ble-test:
    build: ./src/body
    container_name: agv_body_ble_test
    # network_mode host: bleak parla con bluetoothd dell'host via D-Bus
    # (system bus), non serve isolare la rete del container.
    network_mode: host
    # privileged: alcune distro/versioni di bleak+bluez toccano anche
    # /dev/rfkill e i socket HCI oltre al solo D-Bus; con privileged evitiamo
    # di dover elencare le singole capability una per una.
    privileged: true
    volumes:
      - ./src/body:/app
      - /var/run/dbus:/var/run/dbus
    environment:
      - PYTHONPATH=/app
    command: ["python", "-u", "test_ble_square.py"]
