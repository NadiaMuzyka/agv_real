services:
  # --- 1. MEMORIA E COMUNICAZIONE ---
  redis:
    image: redis:alpine
    container_name: agv_redis
    ports:
      - "6379:6379"
    # VOLUMI DISABILITATI: Redis manterrà i dati solo in memoria. Se vuoi persistenza, decommenta qui + la sezione dei volumi in fondo.
    #volumes:
    #  - redis_data:/data
    networks:
      - agv_net
    restart: no
    stop_signal: SIGTERM
    stop_grace_period: 5s
    #Impedisco a redis di cercare di salvare i dati sul disco
    #redis infatti prima di spegnersi cerca di salvare i dati su disco chiamando il file dump.rdb all'interno del container, se il container non viene distrutto, ma solo fermato,
    # quando viene riavviato, riesce a leggere i dati da disco e riprendere da dove era rimasto.
    #Se invece il container viene distrutto, quando redis cerca di salvare i dati su disco, non riesce a trovare il file dump.rdb, e si spegne con un errore.
    #Se invece disabilitiamo la persistenza dei dati su disco,
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 10
      start_period: 1s
 
  brain:
    build: ./src/brain
    container_name: agv_brain
    depends_on:
      redis:
        condition: service_healthy
      body:
        condition: service_healthy
    volumes:
      - ./src/brain:/app
      # MONTAGGIO ZMQ: Montiamo la cartella radice delle librerie esterne.
      # Questo rispetta l'importazione relativa della libreria CoppeliaSim.
      - ./external_libs:/usr/local/lib/python3.10/dist-packages/
    environment:
      - REDIS_HOST=agv_redis
      - PYTHONPATH=/app
    networks:
      - agv_net
    command: ["python", "-u", "main_brain.py"]
 
  # --- 3. IL CORPO (Hardware & Sim Bridge) ---
  body:
    build: ./src/body
    container_name: agv_body
    depends_on:
      redis:
        condition: service_healthy
    # network_mode host: bleak parla con bluetoothd dell'host via D-Bus,
    # stesso motivo di docker-compose.ble-test.yml — non è opzionale per il BLE.
    network_mode: host
    privileged: true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    volumes:
      - ./src/body:/app
      - /var/run/dbus:/var/run/dbus
    devices:
      - "/dev/video0:/dev/video0"   # webcam per color_zone_sensor
    environment:
      # Con network_mode host, "agv_redis" non è risolvibile via DNS del
      # bridge: Redis è raggiungibile su localhost perché la porta è
      # pubblicata (vedi "6379:6379" nel servizio redis).
      - REDIS_HOST=localhost
      - PYTHONPATH=/app
    command: ["python", "-u", "main_body.py"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/body_ready"]
      interval: 2s
      timeout: 5s
      retries: 30
 
  vision:
    build: ./src/vision
    container_name: agv_vision
    # ... altre config ...
    devices:
      - "/dev/video0:/dev/video0" # Mappa la webcam
    # A volte serve dare privilegi di accesso al dispositivo
    privileged: true 
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_HOST=agv_redis
      - PYTHONPATH=/app
      - USE_WEBCAM=false # Imposta a true se vuoi usare la webcam reale, false per usare il video di test
      - COPPELIA_HOST=host.docker.internal # Indica al codice dove cercare Coppelia
    networks:
      - agv_net
    command: ["python", "-u", "person_detector.py"]
 
networks:
  agv_net:
    driver: bridge
 
# VOLUMI PER PERSISTENZA DATI (es. Redis)
#commento il volume, in questo modo redis non salva i dati su disco, ma li mantiene solo in memoria.
#Se vuoi mantenere i dati anche dopo che il container viene fermato, puoi decommentare questa sezione.
#volumes:
#  redis_data:
 
 
# Aggiunto fuori da services:
x-compose-shutdown-parallel: true  # non standard, non funziona ovunque